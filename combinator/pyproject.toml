[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epinoic-combinator"
version = "0.1.1"
description = "Epinoic AI combinator: a separate agent that combines the specialists' answers to one request into one synthesis, run on the cheapest tier through a provider interface, its every output validated against the translator's published synthesis contract (epinoic.integration.combinator-port.v1) before it leaves. The translator's hub stays the independent checker of every synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Standard library only at run time: the combinator never imports the translator, the engine or Z3. It carries a copy
# of the published contract (src/epinoic_combinator/contract/, written by the translator's integration/tools/generate.py).
dependencies = []

[project.optional-dependencies]
# The conformance tests compare the combinator with the translator's own combinator port and hub
# (epinoic_logic.integration.combinator_port, epinoic_logic.channel): inside the translator repository tests/conftest.py
# uses its src/; a copy of the sub-project outside it needs the translator package installed for them.
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"epinoic_combinator" = ["pack/*.md", "pack/*.json", "contract/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
