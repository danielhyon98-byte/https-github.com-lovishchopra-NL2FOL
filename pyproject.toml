[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epinoic-logic"
version = "0.1.0"
description = "Epinoic AI logic translator and Z3 verification engine: restricted typed IR, deterministic validator and compiler, Z3 procedures, provenance-bound results, specialist-claim translation with grounding checks."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  # the solver series the integration kit accepts (integration/COMPATIBILITY.json components.z3_solver, the bootstrap's check):
  # a later series can decide a nonlinear problem differently within the same budget (integration gate 2), so the declared range
  # widens only with that pin, after the whole suite is measured with it (tests/integration/test_declared_z3_range.py)
  "z3-solver>=5.1.0,<5.2",
  "pydantic>=2.6",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
providers = ["anthropic>=0.40", "httpx>=0.27"]
dev = ["pytest>=8.2", "pytest-timeout>=2", "hypothesis>=6", "httpx>=0.27"]

[project.scripts]
epinoic-logic = "epinoic_logic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"epinoic_logic" = [
  "translate/prompts/*.txt",
  "translate/prompts/*.md",
]

[tool.pytest.ini_options]
# The documented test command (`python -m pytest -q`, from the repository root) runs three suites: the translator's
# (tests/), the overseer sub-project's own (overseer/tests/) and the flash-router sub-project's own (flash-router/tests/),
# each also runnable alone from its sub-project. The combinator's suite runs inside tests/integration (and the
# flash router's once more there, from its own directory).
testpaths = ["tests", "overseer/tests", "flash-router/tests"]
# The sub-projects' source trees are on the path for the test session, so the command also runs where only the
# translator is installed (pip install -e ".[dev,service,providers]"); the service and the pool attach the router by its
# module name, in a process that inherits this path (README.md).
pythonpath = ["overseer/src", "flash-router/src"]
timeout = 120
addopts = "-ra -m 'not stress'"
markers = ["stress: long-running load and soak tests (run with -m stress)"]
